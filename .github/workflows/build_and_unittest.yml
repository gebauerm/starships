name: Cargo Build & UnitTest

on:
  push:
  pull_request:


env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Starships - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchains:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v3
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo install cargo-junit
      - run: cargo build --verbose
      - run: cargo test --verbose --name test_report.xml
        if: scucess() || failure()
        with:
          report_paths: '/test_report.xml'
