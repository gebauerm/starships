name: Cargo Build & UnitTest

on:
  push:
  pull_request:


env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Starships - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchains:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v3
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --verbose
      - run: cargo install cargo-junit
      - name: Test
        run: cargo test --verbose --name test_report.xml
      - name: Publish Results
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: '/test_report.xml'
